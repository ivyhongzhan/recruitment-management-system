name: Java and MySQL integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application and MySQL integration tests
        run: mvn -B verify
      - name: Check carried-forward browser script syntax
        run: node --check src/main/resources/static/app.js
