name: Java and MySQL integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rms_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      RMS_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/rms_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RMS_TEST_MYSQL_USERNAME: test
      RMS_TEST_MYSQL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application and MySQL integration tests
        run: mvn -B verify -Dtestcontainers.disabled=true
      - name: Check carried-forward browser script syntax
        run: node --check src/main/resources/static/app.js
